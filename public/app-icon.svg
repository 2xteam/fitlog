<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fa7e1e"/><stop offset=".35" stop-color="#d62976"/><stop offset=".68" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient><radialGradient id="gGlow" cx=".12" cy=".95" r=".55"><stop offset="0" stop-color="#feda75" stop-opacity=".85"/><stop offset="1" stop-color="#feda75" stop-opacity="0"/></radialGradient></defs>
  <rect width="192" height="192" rx="44" fill="url(#g)"/><rect width="192" height="192" rx="44" fill="url(#gGlow)"/>
  <!--
    게이지: 같은 <circle>(중심 96,106.46 / r 60)에 dasharray만 달리 줘서 그린다.
    호를 각각 path로 그리면 미세한 좌표 오차로 두께·반지름이 어긋나 보인다.
    회전 158.96도 = 왼쪽 아래 시작점.
  -->
