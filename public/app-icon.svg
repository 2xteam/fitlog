            stroke-dasharray="232.6 144.4"/>
    <circle cx="96" cy="106.46" r="60" stroke="#feda75"
            stroke-dasharray="128 249"/>
  </g>
  <path d="M64 114 L86 90 L106 100 L128 74" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
